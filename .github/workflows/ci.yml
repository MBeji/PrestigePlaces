name: CI

on:
  push:
  pull_request:

jobs:
  maquette:
    name: Hypothèses et maquette
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Régénération depuis les hypothèses
        run: python3 -I scripts/apply_hypotheses.py
      - name: Fichiers générés à jour
        run: git diff --exit-code -- data/situation.json prototype/index.html
      - name: Logique de la maquette
        run: node scripts/test_prototype.js prototype/index.html

  application:
    name: Application (lot 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Présence de l'application
        id: app
        run: test -f app/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - name: Dépendances
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Base de développement
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: |
          cp -n .env.example .env || true
          npm run db:push --if-present
          npm run db:seed --if-present
      - name: Vérifications
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: |
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present
